<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上班狂徒 · 本地查收</title>
  <style>:root {
  --ink: #151615;
  --paper: #f3f1e9;
  --acid: #b9ff4a;
  --orange: #ff5a36;
  --muted: #75776f;
  --line: rgba(21, 22, 21, 0.16);
  --panel: rgba(255, 255, 255, 0.72);
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--paper);
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 12% 12%, rgba(185, 255, 74, 0.16), transparent 30%),
    var(--paper);
  color: var(--ink);
  font-family: "Noto Sans SC", system-ui, sans-serif;
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
}

button:not(:disabled) {
  cursor: pointer;
}

button:focus-visible,
input:focus-visible {
  outline: 3px solid rgba(115, 167, 255, 0.55);
  outline-offset: 2px;
}

.entry-shell {
  --entry-top: clamp(44px, 7.5vh, 92px);
  min-height: 100svh;
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(420px, .85fr);
  align-items: start;
  padding-block: var(--entry-top);
  background: #020a0e;
  color: #f2f9fa;
  overflow: hidden;
  position: relative;
  isolation: isolate;
}

.entry-background-image {
  position: absolute;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 48%;
  pointer-events: none;
}

.noise {
  position: fixed;
  z-index: 2;
  inset: 0;
  pointer-events: none;
  opacity: .16;
  mix-blend-mode: screen;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E");
}

.entry-hero {
  --entry-logo-width: min(347px, 52%);
  height: calc(100svh - var(--entry-top) * 2);
  min-height: 0;
  padding: 0 clamp(48px, 6vw, 92px);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  position: relative;
  z-index: 1;
  border-right: 1px solid rgba(181, 233, 245, .13);
}

.entry-hero .eyebrow {
  width: var(--entry-logo-width);
  justify-self: center;
  gap: 12px;
  font-size: 16px;
  line-height: 1.15;
  letter-spacing: .1em;
}

.eyebrow,
.entry-mark,
.guide-head span,
.zone-title span,
.dark-zone-panel > div > span,
.action-title > div > span,
.special-action > div > span,
.brand-lockup span,
.turn-chip {
  font: 700 11px/1 "Space Mono", monospace;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 9px;
  color: rgba(215, 242, 248, .72);
}

.live-dot {
  width: 14px;
  height: 14px;
  flex: 0 0 14px;
  border-radius: 50%;
  background: #a8e9f7;
  box-shadow: 0 0 0 5px rgba(126, 221, 241, .13), 0 0 18px rgba(126, 221, 241, .7);
}

.entry-hero h1 {
  margin: 22px 0 0;
  font-size: clamp(68px, 8vw, 126px);
  line-height: .92;
  letter-spacing: -.08em;
  font-weight: 900;
  color: #f2f7f8;
  text-shadow: 0 12px 36px rgba(0, 0, 0, .62);
}

.entry-hero h1 span {
  color: #aeeaf6;
  display: block;
  margin-left: .42em;
  -webkit-text-stroke: 1px rgba(2, 15, 21, .8);
  text-shadow: 0 0 28px rgba(96, 202, 224, .2), 0 12px 36px rgba(0, 0, 0, .62);
}

.entry-title-logo {
  align-self: center;
  justify-self: center;
  display: block;
  width: var(--entry-logo-width);
  height: auto;
  max-height: min(38svh, 347px);
  object-fit: contain;
  object-position: left center;
  margin: 0;
  filter: drop-shadow(0 14px 30px rgba(0, 0, 0, .62));
}

.hero-copy {
  align-self: end;
  justify-self: center;
  width: var(--entry-logo-width);
  max-width: 520px;
  margin: 0;
  font-size: clamp(17px, 1.5vw, 22px);
  font-weight: 600;
  line-height: 1.65;
  color: rgba(237, 248, 250, .84);
  text-shadow: 0 3px 14px rgba(0, 0, 0, .78);
}

.hero-card-fan {
  display: none;
}

.fan-card {
  position: absolute;
  width: 112px;
  height: 158px;
  border: 2px solid var(--ink);
  border-radius: 8px;
  padding: 12px;
  box-shadow: 7px 7px 0 rgba(21,22,21,.92);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.fan-card b {
  font: 900 34px "Space Mono", monospace;
}

.fan-card span {
  align-self: center;
  font: 900 34px "Space Mono", monospace;
}

.fan-1 { left: 18px; top: 26px; transform: rotate(-14deg); background: var(--orange); }
.fan-4 { left: 75px; top: 10px; transform: rotate(2deg); background: #6ce5d8; }
.fan-8 { left: 137px; top: 30px; transform: rotate(15deg); background: #efefea; }

.lobby-panel {
  align-self: start;
  justify-self: center;
  width: min(470px, calc(100% - 52px));
  height: calc(100svh - var(--entry-top) * 2);
  max-height: calc(100svh - var(--entry-top) * 2);
  overflow-y: auto;
  padding: clamp(28px, 4vw, 48px);
  position: relative;
  z-index: 1;
  border: 1px solid rgba(191, 236, 246, .28);
  border-radius: 26px;
  background:
    linear-gradient(150deg, rgba(11, 36, 46, .82), rgba(2, 16, 22, .9));
  box-shadow:
    0 30px 80px rgba(0, 0, 0, .58),
    inset 0 1px rgba(255, 255, 255, .08);
  backdrop-filter: blur(18px) saturate(1.1);
}

.lobby-title {
  display: flex;
  justify-content: space-between;
  align-items: end;
  padding-bottom: 18px;
  border-bottom: 1px solid rgba(193, 235, 244, .28);
}

.lobby-title span {
  font: 700 11px "Space Mono", monospace;
  letter-spacing: .14em;
  color: #9de4f2;
}

.lobby-title h2 {
  margin: 6px 0 0;
  font-size: 34px;
  line-height: 1;
  color: #f3f8f9;
}

.mode-picker {
  display: grid;
  width: 100%;
  gap: 6px;
}

.mode-picker > span {
  font: 700 11px "Space Mono", monospace;
  letter-spacing: .14em;
  color: #9de4f2;
}

.mode-picker select {
  width: 100%;
  border: 0;
  background: transparent;
  color: #f3f8f9;
  font-size: 34px;
  line-height: 1.1;
  font-weight: 900;
  letter-spacing: -.04em;
  padding: 0 42px 0 0;
}

.mode-picker select option {
  background: #08212a;
  color: #f3f8f9;
  font-size: 18px;
}

.refresh-button,
.quiet-button {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-weight: 700;
  padding: 8px 4px;
}

.refresh-button:hover,
.quiet-button:hover {
  color: var(--ink);
}

.field {
  display: grid;
  gap: 8px;
  margin-top: 26px;
}

.field span {
  font-size: 12px;
  font-weight: 800;
  color: rgba(229, 245, 248, .78);
}

.entry-shell .field input,
.manual-join input {
  width: 100%;
  border: 1px solid rgba(181, 230, 240, .34);
  background: rgba(0, 10, 15, .62);
  min-height: 52px;
  padding: 0 15px;
  color: #f2f8f9;
  border-radius: 11px;
  box-shadow: inset 0 1px 12px rgba(0, 0, 0, .28);
}

.entry-shell .field input::placeholder,
.manual-join input::placeholder {
  color: rgba(215, 237, 241, .38);
}

.primary-button {
  border: 1px solid var(--ink);
  background: var(--acid);
  min-height: 52px;
  padding: 0 18px;
  font-weight: 900;
  box-shadow: 5px 5px 0 var(--ink);
  transition: transform .14s, box-shadow .14s;
}

.lobby-panel > .primary-button {
  width: 100%;
  margin-top: 12px;
}

.entry-shell .primary-button {
  border-color: rgba(210, 246, 252, .8);
  border-radius: 11px;
  background: #a9e8f5;
  color: #031219;
  box-shadow: 0 10px 28px rgba(1, 8, 12, .44);
}

.entry-shell .primary-button:not(:disabled):hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 34px rgba(1, 8, 12, .58);
}

.entry-shell .empty-room {
  border-color: rgba(190, 231, 240, .16);
  color: rgba(220, 241, 245, .58);
}

.entry-shell .empty-room b {
  color: rgba(239, 249, 251, .9);
}

.entry-shell .room-list {
  border-color: rgba(190, 231, 240, .22);
}

.entry-shell .room-row {
  border-color: rgba(190, 231, 240, .14);
}

.entry-shell .room-row b {
  color: rgba(239, 249, 251, .9);
}

.entry-shell .room-row span,
.entry-shell .room-list-head,
.entry-shell .refresh-button {
  color: rgba(219, 240, 244, .62);
}

.entry-shell .room-avatar {
  border-color: rgba(190, 231, 240, .44);
  background: rgba(128, 219, 238, .14);
  color: #a9e8f5;
}

.entry-shell .room-row button,
.entry-shell .manual-join button {
  border-color: rgba(210, 246, 252, .58);
  border-radius: 8px;
  background: #a9e8f5;
  color: #031219;
}

.entry-shell .offline-note,
.entry-shell .notice {
  border-color: #8edcea;
  background: rgba(104, 203, 224, .09);
  color: rgba(227, 245, 248, .76);
}

.entry-shell .entry-footnote {
  color: rgba(214, 237, 241, .52);
}

.primary-button:not(:disabled):hover {
  transform: translate(2px, 2px);
  box-shadow: 3px 3px 0 var(--ink);
}

.primary-button:disabled {
  opacity: .55;
}

.room-list-head {
  display: flex;
  justify-content: space-between;
  margin-top: 30px;
  font-size: 12px;
  font-weight: 800;
}

.room-list-head em {
  font-style: normal;
  color: var(--muted);
}

.room-list {
  border-top: 1px solid var(--ink);
  margin-top: 10px;
  max-height: 264px;
  overflow-y: auto;
}

.room-row {
  display: grid;
  grid-template-columns: 38px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}

.room-avatar {
  width: 38px;
  height: 38px;
  border: 1px solid var(--ink);
  background: var(--orange);
  display: grid;
  place-items: center;
  font-weight: 900;
}

.room-row div:nth-child(2) {
  min-width: 0;
}

.room-row b,
.room-row span {
  display: block;
}

.room-row b {
  font-size: 13px;
}

.room-row span {
  margin-top: 3px;
  color: var(--muted);
  font: 400 10px "Space Mono", monospace;
}

.room-row button,
.manual-join button {
  min-height: 36px;
  padding: 0 15px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: white;
  font-weight: 800;
}

.room-row button:hover,
.manual-join button:hover {
  background: var(--orange);
}

.empty-room {
  min-height: 122px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
  gap: 6px;
  font-size: 12px;
}

.empty-room b {
  color: var(--ink);
  font-size: 14px;
}

.manual-join {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  margin-top: 12px;
}

.manual-join input {
  min-height: 42px;
}

.notice {
  margin: 12px 0 0;
  padding: 10px 12px;
  background: rgba(255, 90, 54, .12);
  border-left: 3px solid var(--orange);
  color: #7a2817;
  font-size: 12px;
  font-weight: 700;
}

.entry-footnote {
  color: var(--muted);
  font: 400 10px/1.5 "Space Mono", monospace;
  margin: 18px 0 0;
  text-align: center;
}

.game-shell {
  min-height: 100svh;
  background:
    radial-gradient(circle at 56% 12%, rgba(41, 113, 128, .2), transparent 30%),
    radial-gradient(circle at 50% 80%, rgba(185, 255, 74, .08), transparent 34%),
    #061015;
  color: #f5f6f2;
}

.topbar {
  height: 68px;
  border-bottom: 1px solid rgba(226, 248, 255, .18);
  background: rgba(4, 13, 18, .9);
  backdrop-filter: blur(14px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  position: sticky;
  top: 0;
  z-index: 50;
}

.brand-lockup {
  display: flex;
  align-items: center;
}

.game-header-logo {
  display: block;
  width: auto;
  height: 46px;
  object-fit: contain;
  object-position: left center;
}

.room-tools {
  display: flex;
  align-items: center;
  gap: 9px;
}

.room-code {
  font: 400 11px "Space Mono", monospace;
  color: rgba(235, 247, 250, .72);
  border-right: 1px solid rgba(232, 246, 250, .2);
  padding-right: 12px;
}

.room-code b {
  letter-spacing: .12em;
}

.room-tools button {
  border: 1px solid rgba(232, 246, 250, .3);
  background: transparent;
  color: #f5f6f2;
  min-height: 32px;
  padding: 0 10px;
  font-size: 11px;
  font-weight: 800;
}

.room-tools button:not(.quiet-button):hover {
  background: var(--acid);
}

.room-tools .quiet-button {
  border-color: transparent;
  padding: 0 3px;
}

.game-table-shell .topbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 286px;
  height: 124px;
  flex-direction: column;
  align-items: stretch;
  justify-content: center;
  gap: 12px;
  padding: 14px 18px;
  border-right: 1px solid rgba(225, 245, 250, .16);
}

.game-table-shell .room-tools {
  width: 100%;
  justify-content: space-between;
}

.game-table-shell .room-code {
  padding-right: 0;
  border-right: 0;
  font-size: 9px;
}

.game-table-shell .room-tools button {
  min-height: 26px;
  font-size: 9px;
}

.game-table-shell .play-layout {
  min-height: 100svh;
}

.game-table-shell .card-guide {
  top: 0;
  height: 100svh;
  padding-top: 144px;
}

.game-table-shell .floating-timer {
  top: 18px;
}

.waiting-card {
  width: min(760px, calc(100% - 32px));
  margin: clamp(38px, 9vh, 100px) auto;
  border: 1px solid var(--ink);
  padding: clamp(28px, 5vw, 54px);
  background: rgba(255,255,255,.68);
  box-shadow: 10px 10px 0 var(--ink);
  position: relative;
}

.waiting-stamp {
  position: absolute;
  right: 24px;
  top: 20px;
  font: 700 11px "Space Mono", monospace;
  color: var(--orange);
}

.waiting-kicker {
  font: 700 11px "Space Mono", monospace;
  color: var(--muted);
}

.waiting-card h2 {
  font-size: clamp(34px, 6vw, 64px);
  letter-spacing: -.05em;
  margin: 12px 0;
}

.waiting-card > p {
  color: var(--muted);
  margin: 0;
  font-size: 14px;
}

.waiting-seats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 34px 0;
}

.waiting-seat {
  min-height: 156px;
  border: 1px dashed #a5a79f;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #a2a49c;
}

.waiting-seat.filled {
  border-style: solid;
  border-color: var(--ink);
  color: var(--ink);
  background: white;
}

.waiting-avatar {
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  border: 1px solid currentColor;
  border-radius: 50%;
  font-size: 20px;
  font-weight: 900;
  margin-bottom: 9px;
}

.waiting-seat b {
  font-size: 14px;
}

.waiting-seat small {
  color: var(--muted);
  margin-top: 3px;
}

.waiting-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.waiting-actions button {
  flex: 1;
  min-height: 50px;
}

.outline-button {
  border: 1px solid var(--ink);
  background: white;
  font-weight: 800;
}

.outline-button:hover {
  background: #efefea;
}

.host-hint {
  color: var(--muted);
  font-size: 13px;
}

.play-layout {
  display: grid;
  grid-template-columns: 286px minmax(0, 1fr);
  align-items: start;
}

.card-guide {
  position: sticky;
  top: 68px;
  height: calc(100svh - 68px);
  overflow-y: auto;
  border-right: 1px solid rgba(225, 245, 250, .16);
  background:
    linear-gradient(180deg, rgba(10, 29, 36, .96), rgba(5, 17, 23, .94)),
    #061015;
  padding: 22px 18px;
  color: #f5f6f2;
}

.guide-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  border-bottom: 2px solid rgba(229, 246, 250, .52);
}

.guide-head span {
  color: var(--orange);
  font-size: 11px;
  font-weight: 900;
}

.guide-head span:last-child {
  color: rgba(231, 245, 248, .58);
}

.card-guide > p {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
  margin: 12px 0;
}

.guide-list {
  display: grid;
}

.guide-list article {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr) auto;
  gap: 9px;
  align-items: start;
  min-height: 66px;
  padding: 10px 0;
  border-top: 1px solid rgba(229, 246, 250, .12);
}

.guide-list article:first-child {
  border-top: 0;
}

.guide-number {
  width: 40px;
  height: 46px;
  color: var(--ink);
  border: 1px solid rgba(255, 255, 255, .7);
  display: grid;
  grid-template-rows: auto 1fr;
  padding: 3px;
}

.guide-number strong {
  justify-self: start;
  font: 900 12px/1 "Space Mono", monospace;
}

.skill-icon {
  display: block;
  filter: brightness(0) saturate(100%);
  pointer-events: none;
}

.guide-skill-icon {
  place-self: center;
  width: 25px;
  height: 25px;
  object-fit: contain;
}

.guide-list article > div:nth-child(2) {
  min-width: 0;
}

.guide-list b,
.guide-list small {
  display: block;
}

.guide-list b {
  font-size: 12px;
}

.guide-list small {
  color: rgba(231, 245, 248, .56);
  font-size: 9px;
  line-height: 1.35;
  margin-top: 3px;
}

.guide-list article > em {
  font-size: 12px;
  font-weight: 900;
  line-height: normal;
  font-style: normal;
  color: #f5f6f2;
}

.guide-note {
  margin-top: 14px;
  padding: 11px;
  background: var(--ink);
  color: white;
  font-size: 10px;
  line-height: 1.55;
}

.guide-note b {
  color: var(--acid);
  display: block;
  margin-bottom: 4px;
}

.board-stage {
  padding: 18px clamp(14px, 2.1vw, 30px) 42px;
  min-width: 0;
  position: relative;
  background:
    radial-gradient(circle at 50% 38%, rgba(64, 157, 172, .12), transparent 38%),
    linear-gradient(180deg, rgba(255, 255, 255, .015), transparent 50%);
}

.turn-banner {
  min-height: 60px;
  border: 1px solid var(--ink);
  border-left: 8px solid var(--active-player);
  background: rgba(255,255,255,.74);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  box-shadow: 4px 4px 0 rgba(21,22,21,.18);
}

.turn-banner.timer-only {
  justify-content: flex-end;
}

.turn-banner > div {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.turn-chip {
  color: var(--muted);
  font-size: 8px;
}

.turn-banner b {
  font-size: 17px;
}

.timer {
  font: 700 22px "Space Mono", monospace;
  min-width: 78px;
  text-align: center;
}

.timer.urgent {
  color: var(--orange);
  animation: blink 1s steps(2) infinite;
}

.floating-timer {
  --timer-ring: var(--acid);
  position: fixed;
  z-index: 45;
  top: 82px;
  right: 18px;
  width: 62px;
  height: 62px;
  min-width: 0;
  padding: 0;
  border: 1px solid var(--ink);
  border-radius: 50%;
  background: conic-gradient(
    var(--timer-ring) 0 var(--timer-progress),
    rgba(21,22,21,.16) var(--timer-progress) 360deg
  );
  color: white;
  box-shadow: 3px 3px 0 rgba(21,22,21,.2);
  font-size: 16px;
  line-height: 1;
  display: grid;
  place-items: center;
  pointer-events: none;
}

.floating-timer::before {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 50%;
  background: var(--ink);
}

.floating-timer > span {
  position: relative;
  z-index: 1;
}

.floating-timer.urgent {
  --timer-ring: var(--orange);
  border-color: var(--orange);
  color: white;
}

@keyframes blink { 50% { opacity: .42; } }

.office-board {
  min-height: clamp(720px, calc(100svh - 112px), 860px);
  margin-top: 0;
  border: 1px solid rgba(218, 241, 247, .26);
  border-radius: 18px;
  background:
    linear-gradient(180deg, rgba(2, 9, 13, .12), rgba(2, 8, 12, .3)),
    #071218;
  box-shadow:
    0 28px 70px rgba(0, 0, 0, .46),
    inset 0 0 0 1px rgba(255, 255, 255, .04);
  position: relative;
  overflow: hidden;
  isolation: isolate;
}

.table-scene-image {
  position: absolute;
  z-index: 0;
  inset: 0;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  filter: saturate(.94) contrast(1.04) brightness(1.08);
  transform: scale(1.005);
  pointer-events: none;
}

.board-grid {
  position: absolute;
  z-index: 1;
  inset: 0;
  background:
    radial-gradient(circle at 50% 48%, transparent 42%, rgba(0, 6, 9, .32) 78%),
    linear-gradient(180deg, rgba(8, 27, 35, .08), rgba(1, 7, 10, .24));
  pointer-events: none;
}

.office-board::before {
  content: "";
  position: absolute;
  z-index: 2;
  inset: 0;
  border: 0;
  background:
    linear-gradient(90deg, rgba(2, 10, 14, .2), transparent 19%, transparent 81%, rgba(2, 10, 14, .2)),
    linear-gradient(180deg, rgba(3, 11, 15, .08), transparent 30%, transparent 76%, rgba(1, 7, 10, .3));
  box-shadow: inset 0 0 70px rgba(0, 0, 0, .28);
  transform: none;
  pointer-events: none;
}

.player-seat {
  position: absolute;
  width: min(31%, 350px);
  z-index: 6;
  border: 0;
  background: transparent;
  box-shadow: none;
  padding: 0;
  color: #f7f8f4;
  transition: transform .2s;
}

.player-seat.is-active {
  transform: translateY(-2px);
}

.player-seat.is-active .player-info {
  box-shadow:
    0 0 0 3px color-mix(in srgb, var(--player-color), transparent 28%),
    0 14px 28px rgba(0, 0, 0, .42);
}

.player-left { left: 3%; top: 5%; }
.player-right { right: 3%; top: 5%; }
.player-self {
  left: 50%;
  bottom: 1.8%;
  width: min(38%, 420px);
  display: flex;
  flex-direction: column;
  transform: translateX(-50%);
}
.player-self.is-active { transform: translate(-50%, -2px); }

.player-self .player-hand {
  order: 1;
}

.player-self .player-info {
  order: 2;
}

.self-end-turn-button {
  position: absolute;
  z-index: 8;
  right: 3%;
  bottom: 8.5%;
  min-height: 42px;
  padding: 0 16px;
  border: 1px solid var(--acid);
  border-radius: 999px;
  background: var(--acid);
  color: var(--ink);
  box-shadow: 0 10px 24px rgba(0, 0, 0, .35);
  font-size: 11px;
  font-weight: 900;
  transition: transform .16s, box-shadow .16s, opacity .16s;
}

.self-end-turn-button:disabled {

}

.self-end-turn-button:not(:disabled):hover {
  transform: translateY(-2px);

}

.player-info {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  min-height: 62px;
  padding: 6px 10px 6px 7px;
  border: 3px solid rgba(218, 232, 225, .62);
  border-radius: 24px;
  background:
    linear-gradient(90deg, rgba(20, 69, 58, .92), rgba(15, 55, 52, .9));
  box-shadow: 0 12px 24px rgba(0, 0, 0, .32);
  backdrop-filter: blur(8px);
  transition: box-shadow .2s;
}

.avatar {

}

.player-info b,
.player-info span {

}

.player-info b {
  font-size: 13px;

  overflow: hidden;
  text-overflow: ellipsis;
}

.player-info span {
  color: rgba(239, 249, 246, .72);

  margin-top: 2px;
}

.health-pill {

}

}

.health-pill strong {

.player-hand {

}

.game-card,

.player-hand .game-card,

  box-shadow:
    4px 0 0 -2px white,

    0 4px 0 -2px white,
    0 -4px 0 -2px white,

}

.player-hand > :nth-child(1) { --fan-rotate: -4deg; --fan-y: 3px; }
.player-hand > :nth-child(2) { --fan-rotate: -2deg; --fan-y: 1px; }
.player-hand > :nth-child(4) { --fan-rotate: 2deg; --fan-y: 1px; }

.player-self .player-hand > :nth-child(2) { --fan-rotate: 2deg; }
.player-self .player-hand > :nth-child(4) { --fan-rotate: -2deg; }
.player-self .player-hand > :nth-child(5) { --fan-rotate: -4deg; }

.player-hand .game-card:hover {

.game-card strong {

}

.game-card > b {
  place-self: center;

  line-height: 1.12;
  text-align: center;
  overflow-wrap: anywhere;
}

.card-back {
  --card-color: var(--ink);

}

.card-back-logo {

.flying-card.card-back {

}

.player-dark-count {

}

.center-console {

    linear-gradient(180deg, rgba(6, 19, 24, .5), rgba(4, 14, 19, .4));

.zone-title {

}

.zone-title b {

.zone-title small {

.zone-title em {

.reveal-pile {
  min-height: 118px;

  justify-content: center;

  padding: 10px 28px 14px;

}

.reveal-pile-card {
  position: absolute;

  height: 96px;

  box-shadow:
    3px 3px 0 var(--ink),
    6px 6px 0 rgba(21, 22, 21, .18);

  grid-template-rows: auto minmax(0, 1fr) auto;
  transform: rotate(var(--pile-tilt));
  z-index: calc(1 + var(--stack-index));
}

.reveal-pile-card strong {

.reveal-pile-card > b {
  grid-row: 3;

.reveal-skill-icon {

.dark-zone-panel {

.office-board.dark-pick-focus .center-console {

.office-board.dark-pick-focus .dark-zone-panel {

@keyframes dark-zone-focus {

    box-shadow:

.deck-indicator {

  --card-start-y: -25vh;

@keyframes play-card-to-reveal {
  0% {
    opacity: .35;
    transform:
      translate(var(--card-start-x), var(--card-start-y))
      rotateY(180deg)
      scale(.42);
  }
  34% {
    opacity: 1;
    transform: translate(0, 0) rotateY(0) scale(1);
  }
  64% {
    opacity: 1;
    transform: translate(0, 0) rotateY(0) scale(1);
  }
  100% {
    opacity: .92;
    transform: translate(0, -12vh) rotateY(0) scale(.46);
  }
}

@keyframes skill-icon-shift {
  0%, 12% {
    opacity: 0;
    transform: translateY(34px) scale(.48);
  }
  34%, 64% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  100% {
    opacity: .9;
    transform: translateY(-12px) scale(.82);
  }
}

.event-caption {

.dice-cube {

  width: 120px;
  height: 120px;

  box-shadow: 8px 8px 0 var(--acid);

  place-items: center;
  font-size: 72px;
  line-height: 1;
}

.dice-cube.rolling {
  animation: dice-roll .54s cubic-bezier(.45, .05, .55, .95) infinite;
}

.dice-cube.stopped {
  animation: dice-stop .24s ease-out both;
}

@keyframes dice-roll {
  0% { transform: translateY(0) rotate(0) scale(1); }
  25% { transform: translateY(-28px) rotate(92deg) scale(.92); }
  50% { transform: translateY(-4px) rotate(184deg) scale(1.04); }
  75% { transform: translateY(-22px) rotate(276deg) scale(.94); }
  100% { transform: translateY(0) rotate(360deg) scale(1); }
}

@keyframes dice-stop {
  0% { transform: scale(1.22) rotate(-8deg); }
  70% { transform: scale(.94) rotate(2deg); }
  100% { transform: scale(1) rotate(0); }
}

.flying-number {

  left: 50%;
  top: 50%;

  bottom: auto;

}

.flying-number.damage { color: var(--orange); }

@keyframes float-number {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(.55);
  }
  18% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.25);
  }
  82% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform:

        calc(-50% + var(--fly-y))

      scale(.82);
  }
}

@keyframes health-impact {

.flying-card {

    function shuffledDemo(values) {
      const copy = [...values];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swap = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[swap]] = [copy[swap], copy[index]];
      }
      return copy;
    }

    function dealDemoGame() {
      const pack = shuffledDemo(cards.flatMap((meta) => (
        Array.from({ length: meta.order }, (_, index) => ({
          ...meta,
          id: `local-${meta.order}-${index}-${Math.random().toString(36).slice(2)}`,
        }))
      )));
      visibleCards = pack.splice(0, 6);
      hiddenDemoCards = pack.splice(0, 4);
      demoHands = {
        self: pack.splice(0, 5),
        right: pack.splice(0, 5),
        left: pack.splice(0, 5),
      };
      demoDeck = pack;
      selfHandCount = demoHands.self.length;
    }

    function showToast(message) {

    function bindTopbar() {
      document.querySelectorAll("[data-exit]").forEach((button) => button.addEventListener("click", renderLobby));
    }

    function renderWaiting() {
      app.innerHTML = `
        <main class="game-shell">
          ${topbar()}
          <section class="waiting-card">
            <div class="waiting-stamp">ROOM / LOCAL1</div>
            <span class="waiting-kicker">正在凑齐三名狂徒</span>
            <h2>1/3 工位已就绪</h2>
            <p>三名真人到齐会自动开局；房主也可以随时用人机补齐空位。</p>
            <div class="waiting-seats">
              <div class="waiting-seat filled"><div class="waiting-avatar">狂</div><b>${playerName}</b><small>你</small></div>
              <div class="waiting-seat"><div class="waiting-avatar">＋</div><b>空工位</b><small>等待加入</small></div>
              <div class="waiting-seat"><div class="waiting-avatar">＋</div><b>空工位</b><small>等待加入</small></div>
            </div>
            <div class="waiting-actions">
              <button class="outline-button" data-copy>复制邀请链接</button>
              <button class="primary-button" id="start">补齐人机并开始</button>
            </div>
            <p class="offline-note">点击“补齐人机并开始”可继续查收完整牌桌。</p>
          </section>
        </main>`;
      bindTopbar();
      document.getElementById("start").addEventListener("click", renderGame);
    }

    function guideHtml() {
      return `
        <aside class="card-guide">
          <div class="guide-head"><span>卡牌种类</span><span>总数</span></div>
          <div class="guide-list">
            ${cards.map((card) => `
              <article>
                <div class="guide-number" style="background:${card.color}">
                  <strong>${card.order}</strong>
                  <img class="skill-icon guide-skill-icon" src="${CARD_ICON_URIS[card.order]}" alt="" aria-hidden="true">
                </div>
                <div><b>${card.name}</b><small>${card.effect}</small></div>
                <em>×${card.order}</em>
              </article>`).join("")}
          </div>
        </aside>`;
    }

    function gameCard(card, showSkillIcon = false, handIndex = null) {
      return `<div class="game-card${showSkillIcon ? " with-skill-icon" : ""}"${handIndex == null ? "" : ` data-hand-index="${handIndex}"`} style="--card-color:${card.color}" title="${card.name}">
        <strong>${card.order}</strong>
        ${showSkillIcon
          ? `<img class="skill-icon activation-skill-icon" src="${CARD_ICON_URIS[card.order]}" alt="" aria-hidden="true">`
          : ""}
        <b>${card.name}</b>
      </div>`;
    }

    function playerSeat(role, name, color, isViewer, hand) {
      const badge = role === "left" ? "左" : role === "right" ? "右" : "我";
      const description = role === "left"
        ? "你的左手边 · 你可以看见这些牌"
        : role === "right"
          ? "你的右手边 · 你可以看见这些牌"
          : "你的工位 · 自己无法看见这些牌";
      return `
        <div class="player-seat player-${role}${role === "self" ? " is-active" : ""}" style="--player-color:${color}">
          <div class="player-info">
            <div class="avatar">${badge}</div>
            <div><b>${name}${isViewer ? "（你）" : ""}</b><span>${description}</span></div>
            <div class="health-pill" id="health-${role}" data-health-seat="${role}">
              <small>记忆点</small><strong>${demoHealth[role]}</strong>
            </div>
          </div>
          <div class="player-hand" id="hand-${role}">
            ${isViewer
              ? selfHandHtml()
              : hand.map((card, index) => gameCard(card, true, index)).join("")}
          </div>
          ${isViewer ? "" : `<div class="player-dark-count" id="dark-count-${role}" hidden></div>`}
        </div>`;
    }

    function captureCardOrigin(seat, handIndex) {
      const card = document.querySelector(
        `#hand-${seat} > [data-hand-index="${handIndex}"]`,
      );
      if (!card) return null;
      const rect = card.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2 - window.innerWidth / 2,
        y: rect.top + rect.height / 2 - window.innerHeight / 2,
      };
    }

    function cardOriginStyle(origin) {
      return origin
        ? ` style="--card-start-x:${origin.x}px;--card-start-y:${origin.y}px"`
        : "";
    }

    function syncSelfHand() {
      const hand = document.getElementById("hand-self");
      if (hand) hand.innerHTML = selfHandHtml();
    }

    function syncBotState(seat) {
      const hand = document.getElementById(`hand-${seat}`);
      if (hand) {
        hand.innerHTML = demoHands[seat]
          .map((card, index) => gameCard(card, true, index))
          .join("");
      }
      const darkCount = document.getElementById(`dark-count-${seat}`);
      if (darkCount) {
        const count = demoBotDark[seat].length;
        darkCount.hidden = count === 0;
        darkCount.textContent = `暗区 ${count} 张`;
      }
      const deck = document.getElementById("deck-count");
      if (deck) deck.textContent = String(demoDeck.length);
    }

    function refillSelf() {
      while (demoHands.self.length < 5 && demoDeck.length > 0) {
        demoHands.self.push(demoDeck.shift());
      }
      selfHandCount = demoHands.self.length;
      syncSelfHand();
      syncBotState("left");
    }

    function syncHealth() {
      ["left", "right", "self"].forEach((seat) => {
        const pill = document.getElementById(`health-${seat}`);
        const value = pill?.querySelector("strong");
        if (value) value.textContent = String(demoHealth[seat]);
      });
    }

    function syncDarkPickFocus() {
      document.querySelector(".office-board")?.classList.toggle(
        "dark-pick-focus",
        darkPickUnlocked,
      );
    }

    function revealPileHtml() {
      const groups = cards
        .map((meta) => visibleCards.filter((card) => card.order === meta.order))
        .filter((group) => group.length > 0);
      return `
        <div class="reveal-pile" id="reveal-pile" aria-label="场上明示的 ${visibleCards.length} 张牌">
          ${groups.map((group) => `
            <div class="reveal-type-stack" style="--stack-size:${group.length}">
              ${group.map((card, index) => `
                <article
                  class="reveal-pile-card"
                  style="--card-color:${card.color};--stack-index:${index};--pile-tilt:${(index - (group.length - 1) / 2) * 1.2}deg"
                  title="${card.name}"
                >
                  <strong>${card.order}</strong>
                  <img class="skill-icon reveal-skill-icon" src="${CARD_ICON_URIS[card.order]}" alt="" aria-hidden="true">
                  <b>${card.name}</b>
                </article>`).join("")}
              <span class="reveal-stack-count">×${group.length}</span>
            </div>`).join("")}
        </div>`;
    }

    function darkHtml() {
      if (hiddenDemoCards.length === 0) return `<span class="dark-empty">已排查完</span>`;
      return hiddenDemoCards.map((_, index) => `
        <button class="mini-dark-card" data-dark="${index}" ${darkPickUnlocked ? "" : "disabled"}
          aria-label="${darkPickUnlocked ? "选择" : "尚不可排查"}第 ${index + 1} 张暗牌">
          <span>?</span><small>${String(index + 1).padStart(2, "0")}</small>
        </button>`).join("");
    }

    function myDarkHtml() {
      if (myDarkCards.length === 0) {
        return `<span class="private-dark-empty">尚未取得暗牌</span>`;
      }
      return myDarkCards.map((card) => gameCard(card)).join("");
    }

    function actionHtml() {
      return `
        <div class="action-dock guess-action-dock">
          <div class="guess-prompt${
            !mustEndTurn && !interactionLocked && selfHandCount > 0 && demoHealth.self > 0
              ? " can-guess"
              : ""
          }"><span>选这猜卡</span><b aria-hidden="true">👉</b></div>
          <div class="guess-buttons">
            ${cards.map((card) => `
              <button data-guess="${card.order}" style="--card-color:${card.color}"
                ${mustEndTurn || card.order < lastGuessOrder || interactionLocked || selfHandCount === 0 ? "disabled" : ""}>
                <strong>${card.order}</strong>
                <img class="skill-icon guess-skill-icon" src="${CARD_ICON_URIS[card.order]}" alt="" aria-hidden="true">
                <span>${card.name}</span>
              </button>`).join("")}
          </div>
        </div>`;
    }

    function updateTimerText() {
      const timer = document.getElementById("turn-timer");
      if (!timer) return;
      const timeText = `${Math.floor(turnSeconds / 60)}:${String(turnSeconds % 60).padStart(2, "0")}`;
      timer.querySelector("span").textContent = timeText;
      timer.setAttribute("aria-label", `本次操作剩余 ${timeText}`);
      timer.style.setProperty("--timer-progress", `${(turnSeconds / 120) * 360}deg`);
      timer.classList.toggle("urgent", turnSeconds <= 15);
    }

    function startActionTimer() {
      clearInterval(timerInterval);
      turnSeconds = 120;
      updateTimerText();
      timerInterval = setInterval(() => {
        turnSeconds = Math.max(0, turnSeconds - 1);
        updateTimerText();
        if (turnSeconds > 0) return;

        clearInterval(timerInterval);
        timerInterval = null;
        void handleOfflineTimeout();
      }, 1000);
    }

    async function handleOfflineTimeout() {
      interactionLocked = true;
      darkPickUnlocked = false;
      syncDarkPickFocus();
      syncControls();
      const darkRow = document.getElementById("dark-row");
      if (darkRow) darkRow.innerHTML = darkHtml();

      const change = healthChange("self", "damage", 1);
      if (change) {
        const overlay = document.createElement("div");
        overlay.className = "event-layer pass-through";
        overlay.innerHTML = flyingNumbersHtml([change]);
        document.body.appendChild(overlay);
        startFlyingNumbers(overlay, [change]);
        await demoWait(1500);
        applyChanges([change]);
        overlay.remove();
      }

      refillSelf();
      lastGuessOrder = 0;
      hasGuessedThisTurn = false;
      mustEndTurn = false;
      syncSelfHand();
      syncControls();

      if (demoHealth.self === 0) {
        const highest = Math.max(demoHealth.left, demoHealth.right);
        const winners = [
          demoHealth.left === highest ? "流程阿强" : "",
          demoHealth.right === highest ? "工位小王" : "",
        ].filter(Boolean).join("、");
        showOfflineResult(
          `${winners} 获胜`,
          "你因操作超时清空了记忆点，其余玩家按剩余点数决胜。",
        );
        return;
      }

      showToast("操作超时：扣 1 点、补满至 5 张，顺到下一位");
      const timer = document.getElementById("turn-timer");
      if (timer) timer.querySelector("span").textContent = "—";
      await playBotTurn("right");
      if (demoHealth.self > 0 && !document.querySelector(".result-layer")) {
        await playBotTurn("left");
      }
      if (demoHealth.self > 0 && !document.querySelector(".result-layer")) {
        interactionLocked = false;
        syncControls();
        startActionTimer();
      }
    }

    function bindGameActions() {
      document.querySelectorAll("[data-guess]").forEach((button) => {
        button.addEventListener("click", () => {
          if (interactionLocked || selfHandCount === 0) return;
          const guessedCard = cards[Number(button.dataset.guess) - 1];
          if (guessedCard.order < lastGuessOrder) return;
          interactionLocked = true;
          clearInterval(timerInterval);
          timerInterval = null;
          hasGuessedThisTurn = true;
          lastGuessOrder = guessedCard.order;
          const cardIndex = demoHands.self.findIndex(
            (card) => card.order === guessedCard.order,
          );
          if (cardIndex < 0) {
            mustEndTurn = true;
            syncControls();
            playWrongGuess(guessedCard);
            return;
          }
          const cardOrigin = captureCardOrigin("self", cardIndex);
          const card = demoHands.self.splice(cardIndex, 1)[0];
          selfHandCount = demoHands.self.length;
          syncSelfHand();
          syncControls();
          playAcceptanceEffect(card, cardOrigin);
        });
      });

      document.getElementById("end-turn").addEventListener("click", async () => {
        if (interactionLocked || !hasGuessedThisTurn) return;
        clearInterval(timerInterval);
        timerInterval = null;
        interactionLocked = true;
        hasGuessedThisTurn = false;
        mustEndTurn = false;
        lastGuessOrder = 0;
        refillSelf();
        syncControls();
        showToast("已补满至 5 张并结束；下一位按顺时针行动");
        const timer = document.getElementById("turn-timer");
        if (timer) timer.querySelector("span").textContent = "—";
        await playBotTurn("right");
        if (demoHealth.self > 0 && !document.querySelector(".result-layer")) {
          await playBotTurn("left");
        }
        if (demoHealth.self > 0 && !document.querySelector(".result-layer")) {
          interactionLocked = false;
          syncControls();
          startActionTimer();
        }
      });

      bindDarkButtons();
      syncControls();
    }

    function syncControls() {
      document.querySelectorAll("[data-guess]").forEach((button) => {
        const order = Number(button.dataset.guess);
        button.disabled = interactionLocked
          || mustEndTurn
          || selfHandCount === 0
          || demoHealth.self === 0
          || order < lastGuessOrder;
      });
      const endButton = document.getElementById("end-turn");
      if (endButton) {
        endButton.disabled = interactionLocked
          || !hasGuessedThisTurn
          || demoHealth.self === 0;
      }
      document.querySelector(".guess-prompt")?.classList.toggle(
        "can-guess",
        !interactionLocked
          && !mustEndTurn
          && selfHandCount > 0
          && demoHealth.self > 0,
      );
    }

    function flyingNumbersHtml(changes) {
      return changes.map((change, index) => `
        <div class="flying-number ${change.kind}" data-change-index="${index}">
          ${change.kind === "damage" ? "−" : "+"}${change.amount}
        </div>`).join("");
    }

    function startFlyingNumbers(layer, changes) {
      requestAnimationFrame(() => {
        changes.forEach((change, index) => {
          const number = layer.querySelector(`[data-change-index="${index}"]`);
          const target = document.getElementById(`health-${change.seat}`);
          if (!number || !target) return;
          const rect = target.getBoundingClientRect();
          const spread = (index - (changes.length - 1) / 2) * 30;
          const startX = window.innerWidth / 2 + spread;
          number.style.left = `${startX}px`;
          number.style.setProperty(
            "--fly-x",
            `${rect.left + rect.width / 2 - startX}px`,
          );
          number.style.setProperty(
            "--fly-y",
            `${rect.top + rect.height / 2 - window.innerHeight / 2}px`,
          );
          number.classList.add("is-ready");
          setTimeout(() => {
            target.classList.remove("health-hit");
            void target.offsetWidth;
            target.classList.add("health-hit");
            setTimeout(() => target.classList.remove("health-hit"), 430);
          }, 1220);
        });
      });
    }

    function finishCardInteraction(message) {
      interactionLocked = false;
      syncControls();
      if (message) showToast(message);
      if (demoHealth.self > 0) startActionTimer();
    }

    function playAcceptanceEffect(card, cardOrigin) {
      const overlay = document.createElement("div");
      overlay.className = "event-layer";
      overlay.style.pointerEvents = "auto";
      overlay.style.setProperty("--event-color", card.color);
      overlay.innerHTML = `
        <div class="played-card from-self"${cardOriginStyle(cardOrigin)}>
          <div class="game-card with-skill-icon" style="--card-color:${card.color}">
            <strong>${card.order}</strong>
            <img class="skill-icon activation-skill-icon" src="${CARD_ICON_URIS[card.order]}" alt="" aria-hidden="true">
            <b>${card.name}</b>
          </div>
        </div>
        <b class="event-caption">${card.effect}</b>`;
      document.body.appendChild(overlay);

      setTimeout(async () => {
        visibleCards.push(card);
        document.getElementById("reveal-pile").outerHTML = revealPileHtml();
        document.getElementById("reveal-count").textContent = `${visibleCards.length} 张`;
        if (selfHandCount === 0) {
          overlay.remove();
          showOfflineWin();
          return;
        }
        if (card.order === 4) {
          overlay.remove();
          if (hiddenDemoCards.length === 0) {
            finishCardInteraction("公共暗区已空");
            return;
          }
          darkPickUnlocked = true;
          syncDarkPickFocus();
          document.getElementById("dark-row").innerHTML = darkHtml();
          bindDarkButtons();
          startActionTimer();
          showToast("已猜中「闸机内工时」：现在可点选一张「?」暗牌");
          return;
        }

        const dice = card.order === 1 || card.order === 3
          ? Math.floor(Math.random() * 6) + 1
          : null;
        if (dice) {
          await playDiceEffect(
            overlay,
            dice,
            card.order === 1
              ? `掷出 ${dice} 点：除自己外所有人扣 ${dice} 点`
              : `掷出 ${dice} 点：自己回复 ${dice} 点`,
          );
        }
        const changes = acceptanceChanges(card, "self", dice);
        if (changes.length === 0) {
          overlay.remove();
          finishCardInteraction(`${card.name}：当前血量已满`);
          return;
        }
        overlay.className = "event-layer pass-through";
        overlay.innerHTML = flyingNumbersHtml(changes);
        startFlyingNumbers(overlay, changes);

        setTimeout(() => {
          applyChanges(changes);
          overlay.remove();
          if (finishAfterHealthChanges("self", changes)) return;
          finishCardInteraction(`${card.name}：点数已经结算到玩家`);
        }, 1500);
      }, 2000);
    }

    function playWrongGuess(card) {
      const overlay = document.createElement("div");
      overlay.className = "event-layer";
      overlay.style.pointerEvents = "auto";
      overlay.innerHTML = `
        <div class="event-verdict wrong">猜错</div>
        <b class="event-caption">你的手牌中没有「${card.name}」</b>`;
      document.body.appendChild(overlay);

      setTimeout(async () => {
        const amount = card.order === 1
          ? Math.floor(Math.random() * 6) + 1
          : 1;
        if (card.order === 1) {
          await playDiceEffect(
            overlay,
            amount,
            `没有「离职OA」，掷出 ${amount} 点`,
          );
        }
        const change = healthChange("self", "damage", amount);
        if (!change) {
          overlay.remove();
          finishCardInteraction("本次猜错未产生点数变化");
          return;
        }
        overlay.className = "event-layer pass-through";
        overlay.innerHTML = flyingNumbersHtml([change]);
        startFlyingNumbers(overlay, [change]);
        setTimeout(() => {
          applyChanges([change]);
          overlay.remove();
          if (demoHealth.self === 0) {
            const highest = Math.max(demoHealth.left, demoHealth.right);
            const winners = [
              demoHealth.left === highest ? "流程阿强" : "",
              demoHealth.right === highest ? "工位小王" : "",
            ].filter(Boolean).join("、");
            showOfflineResult(
              `${winners} 获胜`,
              "你因猜错清空了记忆点，其余玩家按剩余点数决胜。",
            );
            return;
          }
          finishCardInteraction(
            card.order === 1
              ? `没有「离职OA」，自己承担 ${change.amount} 点`
              : `猜错「${card.name}」，自己扣 1 点`,
          );
        }, 1500);
      }, 2000);
    }

    function showOfflineResult(title, message) {
      clearInterval(timerInterval);
      timerInterval = null;
      interactionLocked = true;
      syncControls();
      const result = document.createElement("div");
      result.className = "result-layer";
      result.innerHTML = `
        <section class="result-card">
          <span>SHIFT OVER</span>
          <h2>${title}</h2>
          <p>${message}</p>
          <button class="primary-button" id="offline-restart">再来一局</button>
        </section>`;
      document.body.appendChild(result);
      document.getElementById("offline-restart").addEventListener("click", () => {
        result.remove();
        renderGame();
      });
    }

    function showOfflineWin() {
      showOfflineResult(
        "你猜完了全部手牌",
        "最后一张牌已翻开并归入明示区，你获得本局胜利。",
      );
    }

    function healthChange(seat, kind, amount) {
      const before = demoHealth[seat];
      const after = kind === "damage"
        ? Math.max(0, before - amount)
        : Math.min(6, before + amount);
      const actual = Math.abs(after - before);
      return actual > 0 ? { seat, kind, amount: actual, after } : null;
    }

    function acceptanceChanges(card, actorSeat, forcedDice = null) {
      const dice = forcedDice ?? (Math.floor(Math.random() * 6) + 1);
      const seats = ["left", "right", "self"];
      const leftTarget = { self: "left", right: "self", left: "right" };
      const rightTarget = { self: "right", right: "left", left: "self" };
      if (card.order === 1) {
        return seats
          .filter((seat) => seat !== actorSeat)
          .map((seat) => healthChange(seat, "damage", dice))
          .filter(Boolean);
      }
      if (card.order === 2) {
        return seats
          .filter((seat) => seat !== actorSeat)
          .map((seat) => {
            const difference = demoHealth[seat] - demoHealth[actorSeat];
            return difference > 0
              ? healthChange(seat, "damage", difference)
              : healthChange(seat, "heal", -difference);
          })
          .filter(Boolean);
      }
      if (card.order === 3) {
        return [healthChange(actorSeat, "heal", dice)].filter(Boolean);
      }
      if (card.order === 5) {
        return seats
          .filter((seat) => seat !== actorSeat)
          .map((seat) => healthChange(seat, "damage", 1))
          .filter(Boolean);
      }
      if (card.order === 6) {
        return [healthChange(leftTarget[actorSeat], "damage", 1)].filter(Boolean);
      }
      if (card.order === 7) {
        return [healthChange(rightTarget[actorSeat], "damage", 1)].filter(Boolean);
      }
      if (card.order === 8) {
        return [healthChange(actorSeat, "heal", 1)].filter(Boolean);
      }
      return [];
    }

    function applyChanges(changes) {
      changes.forEach((change) => {
        demoHealth[change.seat] = change.after;
      });
      syncHealth();
    }

    function playerLabel(seat) {
      if (seat === "self") return playerName;
      return seat === "right" ? "工位小王" : "流程阿强";
    }

    function finishAfterHealthChanges(actorSeat, changes) {
      const killedOpponent = changes.some(
        (change) => change.after === 0 && change.seat !== actorSeat,
      );
      if (killedOpponent) {
        showOfflineResult(
          `${playerLabel(actorSeat)} 获胜`,
          `${playerLabel(actorSeat)} 造成最后一击，立即获得本局胜利。`,
        );
        return true;
      }
      if (demoHealth[actorSeat] > 0) return false;

      const contenders = ["left", "right", "self"].filter(
        (seat) => demoHealth[seat] > 0,
      );
      if (contenders.length === 0) {
        showOfflineResult("本局无人获胜", `${playerLabel(actorSeat)} 的记忆点已耗尽。`);
        return true;
      }
      const highest = Math.max(...contenders.map((seat) => demoHealth[seat]));
      const winners = contenders
        .filter((seat) => demoHealth[seat] === highest)
        .map(playerLabel)
        .join("、");
      showOfflineResult(
        `${winners} 获胜`,
        `${playerLabel(actorSeat)} 的记忆点已耗尽，其余玩家按剩余点数决胜。`,
      );
      return true;
    }

    function diceFace(value) {
      return ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"][value - 1] || "⚀";
    }

    async function playDiceEffect(overlay, dice, message) {
      overlay.className = "event-layer";
      overlay.innerHTML = `
        <div class="dice-cube rolling" data-rolling-dice>⚀</div>
        <b class="event-caption">绩效骰子正在滚动…</b>`;
      const rollingDice = overlay.querySelector("[data-rolling-dice]");
      let face = 1;
      const diceTimer = setInterval(() => {
        face = face % 6 + 1;
        rollingDice.textContent = diceFace(face);
      }, 90);
      await demoWait(750);
      clearInterval(diceTimer);
      rollingDice.classList.remove("rolling");
      rollingDice.classList.add("stopped");
      rollingDice.textContent = diceFace(dice);
      overlay.querySelector(".event-caption").textContent = message;
      await demoWait(900);
    }

    function bindDarkButtons() {
      document.querySelectorAll("[data-dark]:not(:disabled)").forEach((button) => {
        button.addEventListener("click", () => {
          clearInterval(timerInterval);
          timerInterval = null;
          const picked = hiddenDemoCards.splice(Number(button.dataset.dark), 1)[0];
          if (picked) myDarkCards.push(picked);
          darkPickUnlocked = false;
          syncDarkPickFocus();
          document.getElementById("dark-row").innerHTML = darkHtml();
          document.getElementById("my-dark-cards").innerHTML = myDarkHtml();
          finishCardInteraction("已排查暗牌：该牌归入你的个人暗区，不能打出");
        });
      });
    }

    const demoWait = (milliseconds) => new Promise(
      (resolve) => setTimeout(resolve, milliseconds),
    );

    async function playBotTurn(seat) {
      const hand = demoHands[seat];
      if (!hand.length || demoHealth[seat] === 0) return;
      const cardIndex = hand
        .map((card, index) => ({ card, index }))
        .sort((a, b) => a.card.order - b.card.order)[0].index;
      const cardOrigin = captureCardOrigin(seat, cardIndex);
      const card = hand.splice(cardIndex, 1)[0];
      syncBotState(seat);

      const overlay = document.createElement("div");
      overlay.className = "event-layer";
      overlay.style.pointerEvents = "auto";
      overlay.style.setProperty("--event-color", seat === "right" ? "#79a4f2" : "#b9ff4a");
      overlay.innerHTML = `
        <div class="played-card from-${seat}"${cardOriginStyle(cardOrigin)}>
          <div class="game-card with-skill-icon" style="--card-color:${card.color}">
            <strong>${card.order}</strong>
            <img class="skill-icon activation-skill-icon" src="${CARD_ICON_URIS[card.order]}" alt="" aria-hidden="true">
            <b>${card.name}</b>
          </div>
        </div>
        <b class="event-caption">${seat === "right" ? "工位小王" : "流程阿强"} 猜中「${card.name}」</b>`;
      document.body.appendChild(overlay);
      await demoWait(2000);

      visibleCards.push(card);
      document.getElementById("reveal-pile").outerHTML = revealPileHtml();
      document.getElementById("reveal-count").textContent = `${visibleCards.length} 张`;

      if (hand.length === 0) {
        overlay.remove();
        showOfflineResult(
          `${seat === "right" ? "工位小王" : "流程阿强"} 获胜`,
          "该人机猜完了自己的全部手牌。",
        );
        return;
      }

      if (card.order === 4 && hiddenDemoCards.length > 0) {
        const picked = hiddenDemoCards.shift();
        demoBotDark[seat].push(picked);
        document.getElementById("dark-row").innerHTML = darkHtml();
        syncBotState(seat);
      }

      const dice = card.order === 1 || card.order === 3
        ? Math.floor(Math.random() * 6) + 1
        : null;
      if (dice) {
        await playDiceEffect(
          overlay,
          dice,
          card.order === 1
            ? `掷出 ${dice} 点：除自己外所有人扣 ${dice} 点`
            : `掷出 ${dice} 点：自己回复 ${dice} 点`,
        );
      }
      const changes = acceptanceChanges(card, seat, dice);
      if (changes.length > 0) {
        overlay.className = "event-layer pass-through";
        overlay.innerHTML = flyingNumbersHtml(changes);
        startFlyingNumbers(overlay, changes);
        await demoWait(1500);
        applyChanges(changes);
      }
      overlay.remove();

      if (finishAfterHealthChanges(seat, changes)) return;

      if (demoDeck.length > 0) {
        hand.push(demoDeck.shift());
        syncBotState(seat);
      }
      showToast(`${seat === "right" ? "工位小王" : "流程阿强"} 已出牌并补回 ${hand.length} 张`);
      await demoWait(450);
    }

    renderLobby();
  </script>
</body>
</html>
